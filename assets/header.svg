<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Anthony Peter — mobile and full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#f5c518"/>
      <stop offset="0.55" stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#e23636"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0fbff"/>
      <stop offset="0.35" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- scanning beam -->
    <rect y="0" width="160" height="300" fill="url(#scan)">
      <animate attributeName="x" from="-160" to="1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g stroke="#22d3ee" stroke-width="2" fill="none" stroke-opacity="0.7">
      <path d="M24 56V24H56"/><path d="M1144 24H1176V56"/>
      <path d="M24 244V276H56"/><path d="M1176 244V276H1144"/>
    </g>

    <!-- text block -->
    <text x="64" y="78" fill="#22d3ee" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="4">// SYSTEM ONLINE — NAIROBI, KE</text>
    <text x="60" y="150" fill="url(#title)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="2">ANTHONY PETER</text>
    <text x="64" y="192" fill="#e5e7eb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">iOS · Android · Full-stack web · Compilers</text>
    <text x="64" y="234" fill="#9ca3af" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15">&gt; shipping WordQuest to the App Store<tspan fill="#22d3ee">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

    <!-- status bar -->
    <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b7280" letter-spacing="2">
      <text x="64" y="268">PWR <tspan fill="#f5c518">██████████</tspan> 100%</text>
      <text x="300" y="268">SWIFT · KOTLIN · TS · C · PYTHON</text>
    </g>

    <!-- arc reactor -->
    <g transform="translate(1000 150)">
      <circle r="118" fill="none" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1"/>
      <circle r="96" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="78" fill="none" stroke="#f5c518" stroke-opacity="0.8" stroke-width="3" stroke-dasharray="60 22">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#67e8f9" stroke-width="10" stroke-opacity="0.85">
        <line x1="0" y1="-58" x2="0" y2="-40"/><line x1="0" y1="40" x2="0" y2="58"/>
        <line x1="-58" y1="0" x2="-40" y2="0"/><line x1="40" y1="0" x2="58" y2="0"/>
        <line x1="-41" y1="-41" x2="-28" y2="-28"/><line x1="28" y1="28" x2="41" y2="41"/>
        <line x1="41" y1="-41" x2="28" y2="-28"/><line x1="-28" y1="28" x2="-41" y2="41"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </g>
      <circle r="62" fill="none" stroke="#e23636" stroke-opacity="0.7" stroke-width="2"/>
      <circle r="44" fill="url(#core)">
        <animate attributeName="r" values="40;46;40" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="16" fill="#ecfeff"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
</svg>
